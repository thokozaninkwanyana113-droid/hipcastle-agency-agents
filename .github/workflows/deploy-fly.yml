# Deploys the Hipcastle web app to Fly.io (Johannesburg by default).
#
# Run it manually: Actions → "Deploy Hipcastle to Fly.io" → Run workflow.
# It also runs on every push to main that touches webapp/, once the repository variable FLY_DEPLOY=true.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN   Fly org token (fly tokens create org) — needed to create the app on the first run
#   ADMIN_PASSWORD  password for admin@hipcastle.agency (at least 10 characters; used on the first boot only)
# Optional secrets, copied to Fly when present:
#   SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS EMAIL_FROM
#   PAYFAST_MERCHANT_ID PAYFAST_MERCHANT_KEY PAYFAST_PASSPHRASE OZOW_SITE_CODE OZOW_PRIVATE_KEY OZOW_API_KEY
#   TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY ANTHROPIC_API_KEY ALERT_WEBHOOK_URL
#   BACKUP_S3_BUCKET BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY (off-site backups; variables BACKUP_S3_REGION, BACKUP_S3_ENDPOINT)
# Optional variables: FLY_APP (default hipcastle), FLY_ORG (default personal), FLY_REGION (default jnb),
#   PAYMENTS_MODE (default sandbox)
name: Deploy Hipcastle to Fly.io

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['webapp/**', '.github/workflows/deploy-fly.yml']

concurrency:
  group: deploy-fly
  cancel-in-progress: false

env:
  FLY_APP: ${{ vars.FLY_APP || 'hipcastle' }}
  FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
  FLY_REGION: ${{ vars.FLY_REGION || 'jnb' }}
  FLY_CONFIG: webapp/deploy/fly.toml

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || vars.FLY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix webapp/server ci
      - run: npm --prefix webapp/server test
      - run: npm --prefix webapp/client ci && npm --prefix webapp/client run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Add the FLY_API_TOKEN repository secret (an org token from 'fly tokens create org')."
            exit 1
          fi
          flyctl auth whoami

      - name: Create the app (first run only)
        run: |
          if flyctl status --app "$FLY_APP" >/dev/null 2>&1; then
            echo "App $FLY_APP exists."
          else
            flyctl apps create "$FLY_APP" --org "$FLY_ORG"
          fi

      - name: Create the database volume (first run only)
        run: |
          count=$(flyctl volumes list --app "$FLY_APP" --json | jq '[.[] | select(.name == "hipcastle_data")] | length')
          if [ "$count" = "0" ]; then
            flyctl volumes create hipcastle_data --app "$FLY_APP" --region "$FLY_REGION" --size 1 --yes
          else
            echo "Volume hipcastle_data exists ($count)."
          fi

      - name: Stage secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_MERCHANT_ID }}
          PAYFAST_MERCHANT_KEY: ${{ secrets.PAYFAST_MERCHANT_KEY }}
          PAYFAST_PASSPHRASE: ${{ secrets.PAYFAST_PASSPHRASE }}
          OZOW_SITE_CODE: ${{ secrets.OZOW_SITE_CODE }}
          OZOW_PRIVATE_KEY: ${{ secrets.OZOW_PRIVATE_KEY }}
          OZOW_API_KEY: ${{ secrets.OZOW_API_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          XERO_CLIENT_ID: ${{ secrets.XERO_CLIENT_ID }}
          XERO_CLIENT_SECRET: ${{ secrets.XERO_CLIENT_SECRET }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          CHATBOT_MODEL: ${{ vars.CHATBOT_MODEL }}
          CHATBOT_EFFORT: ${{ vars.CHATBOT_EFFORT }}
          PAYMENTS_MODE: ${{ vars.PAYMENTS_MODE || 'sandbox' }}
        run: |
          existing=$(flyctl secrets list --app "$FLY_APP" --json 2>/dev/null | jq -r '.[] | (.name // .Name)' || true)
          has() { echo "$existing" | grep -qx "$1"; }
          args=()
          # A stable random JWT secret, generated once and kept on Fly.
          has JWT_SECRET || args+=("JWT_SECRET=$(openssl rand -hex 32)")
          if ! has ADMIN_PASSWORD; then
            if [ -z "$ADMIN_PASSWORD" ]; then
              echo "::error::Add the ADMIN_PASSWORD repository secret for the first deploy (admin@hipcastle.agency)."
              exit 1
            fi
            args+=("ADMIN_PASSWORD=$ADMIN_PASSWORD")
          fi
          for k in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS EMAIL_FROM PAYFAST_MERCHANT_ID PAYFAST_MERCHANT_KEY PAYFAST_PASSPHRASE OZOW_SITE_CODE OZOW_PRIVATE_KEY OZOW_API_KEY TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY ANTHROPIC_API_KEY CHATBOT_MODEL CHATBOT_EFFORT ALERT_WEBHOOK_URL XERO_CLIENT_ID XERO_CLIENT_SECRET BACKUP_S3_BUCKET BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY BACKUP_S3_REGION BACKUP_S3_ENDPOINT; do
            [ -n "${!k}" ] && args+=("$k=${!k}")
          done
          args+=("PAYMENTS_MODE=$PAYMENTS_MODE")
          flyctl secrets set --app "$FLY_APP" --stage "${args[@]}" >/dev/null
          echo "Staged: $(printf '%s\n' "${args[@]}" | cut -d= -f1 | tr '\n' ' ')"

      - name: Deploy
        run: |
          flyctl deploy . --config "$FLY_CONFIG" --dockerfile webapp/Dockerfile \
            --app "$FLY_APP" --primary-region "$FLY_REGION" --remote-only --ha=false --wait-timeout 5m

      - name: HTTPS certificates for www.hipcastle.agency and hipcastle.agency
        run: |
          for host in www.hipcastle.agency hipcastle.agency; do
            flyctl certs show "$host" --app "$FLY_APP" >/dev/null 2>&1 || flyctl certs add "$host" --app "$FLY_APP" || true
          done

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://$FLY_APP.fly.dev/api/health" | grep -q '"ok":true'; then echo "Healthy"; exit 0; fi
            sleep 6
          done
          echo "::error::Health check failed"; flyctl logs --app "$FLY_APP" --no-tail | tail -50; exit 1

      - name: DNS records for GoDaddy
        if: always()
        run: |
          ips=$(flyctl ips list --app "$FLY_APP" --json 2>/dev/null || echo '[]')
          v4=$(echo "$ips" | jq -r '[.[] | select(.Type == "v4" or .Type == "shared_v4")][0].Address // "run: fly ips list"')
          v6=$(echo "$ips" | jq -r '[.[] | select(.Type == "v6")][0].Address // "run: fly ips list"')
          {
            echo "## Hipcastle is deployed to Fly.io 🚀"
            echo
            echo "- App URL: https://$FLY_APP.fly.dev"
            echo "- Region: $FLY_REGION"
            echo
            echo "### DNS records to set in GoDaddy (Domain → DNS → DNS Records)"
            echo
            echo "| Action | Type | Name | Value |"
            echo "|---|---|---|---|"
            echo "| Delete | A | @ | 15.197.148.33 (GoDaddy parking) |"
            echo "| Delete | A | @ | 3.33.130.190 (GoDaddy parking) |"
            echo "| Delete | CNAME | www | @ |"
            echo "| Add | A | @ | $v4 |"
            echo "| Add | AAAA | @ | $v6 |"
            echo "| Add | CNAME | www | $FLY_APP.fly.dev |"
            echo
            echo "### Certificate status"
            echo '```'
            flyctl certs list --app "$FLY_APP" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
